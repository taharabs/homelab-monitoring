# What Zabbix should monitor. Apply with:  zbxctl apply -f monitoring.yml
# Connection settings come from the environment (ZABBIX_URL, ZABBIX_USER, ZABBIX_PASSWORD).

host_groups:
  - Zabbix servers
  - Homelab/Web services

hosts:
  # The built-in host for the Zabbix server. In Docker its agent runs in its own
  # container, so its agent address must point there instead of 127.0.0.1.
  - host: Zabbix server
    name: Zabbix server
    groups: [Zabbix servers]
    templates: [Linux by Zabbix agent, Zabbix server health]
    interface: { dns: zabbix-agent, port: 10050 }
    tags: { env: homelab, role: monitoring }

  # A website checked from the outside, like a customer would see it.
  - host: shop-web
    name: Demo shop website
    groups: [Homelab/Web services]
    tags: { env: homelab, role: web }
    web_checks:
      - name: Shop home page
        url: http://shop-web/
        expect_status: 200
        expect_text: Demo shop
        interval: 30s
        severity: high
